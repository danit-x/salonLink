# Gradle JVM memory — Compose + Hilt builds need a bit more than the default.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Build faster: reuse configuration and outputs between builds.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# Use AndroidX libraries.
android.useAndroidX=true
# Each module's R class contains only its own resources (smaller, faster builds).
android.nonTransitiveRClass=true
# Kotlin code style used by Android Studio's formatter.
kotlin.code.style=official
