# =====================================================================================
# SalonLink — CI/CD
# Pull requests: unit tests. Push to main: signed beta APK, Firebase tester distribution,
# and a public customer download on the latest GitHub Release.
# =====================================================================================
name: Android CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > app/google-services.json

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > salonlink-release.jks
          cat > keystore.properties <<EOF
          storeFile=salonlink-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=salonlink
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build signed beta APK and send it to testers
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.FIREBASE_SA_JSON_B64 }}" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          ./gradlew assembleBeta appDistributionUploadBeta --console=plain

      - name: Keep APK as a short-lived CI artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: salonlink-beta-apk
          path: app/build/outputs/apk/beta/*.apk
          retention-days: 14

      - name: Publish customer APK on latest GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-${{ github.run_number }}
          name: SalonLink Android customer build ${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: app/build/outputs/apk/beta/*.apk
          fail_on_unmatched_files: true
          append_body: true

      - name: Remove secrets from the runner
        if: always()
        run: rm -f app/google-services.json salonlink-release.jks keystore.properties "$RUNNER_TEMP/firebase-sa.json"
