# =====================================================================================
# SalonLink — CI/CD (GitHub Actions, free minutes on a private repo)
# -------------------------------------------------------------------------------------
# Every push and pull request: build the app and run the unit tests (CI).
# Every push to main: also build the signed "beta" APK and send it to the "testers" group
# in Firebase App Distribution (CD). Testers' phones then show an "Update" dialog the next
# time SalonLink opens (MainActivity.checkForTesterUpdate).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON_B64   app/google-services.json, base64
#   KEYSTORE_B64               salonlink-release.jks, base64
#   KEYSTORE_PASSWORD          the keystore password (store and key use the same one)
#   FIREBASE_SA_JSON_B64       service-account key with access to App Distribution, base64
# =====================================================================================
name: Android CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # WHY the full history: versionCode = number of commits (app/build.gradle.kts).
          # A shallow clone would count 1, and phones would refuse the "update".
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > app/google-services.json

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      # ---------- Delivery: only for pushes to main ----------

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > salonlink-release.jks
          cat > keystore.properties <<EOF
          storeFile=salonlink-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=salonlink
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build signed beta APK and send it to testers
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.FIREBASE_SA_JSON_B64 }}" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          ./gradlew assembleBeta appDistributionUploadBeta --console=plain

      - name: Keep the APK as a download on the run page
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: salonlink-beta-apk
          path: app/build/outputs/apk/beta/*.apk
          retention-days: 14

      - name: Remove secrets from the runner
        if: always()
        run: rm -f app/google-services.json salonlink-release.jks keystore.properties "$RUNNER_TEMP/firebase-sa.json"
